[package]
name = "turbo-core"
version = "0.1.0"
edition = "2024"

build = "build/main.rs"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0.104"
prettyplease = "0.3.0"
syn = { version = "3.0", features = ["full", "parsing"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

[dev-dependencies]
rstest = "0.26.1"
