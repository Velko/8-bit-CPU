fetch:
  - - PC.out
    - PC.inc
    - ProgMem.out
    - IR.load

regsets:
  - name: "gp_regs"
    regs: [A, B, C, D]
  - name: "gp_regs+f"
    regs: [A, B, C, D, F]
  - name: "stdp_regs"
    regs: [TDP, SDP]

instructions:
  - name: "nop"
    steps:
      - []

  - name: "xprefix"
    hidden: true
    opcode: 0xEE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - IR.load
        - StepCounter.extended
      - []        # extra NOP to prevent microcode ROM generator from inserting steps reset

  - name: "ldi"
    args:
      - r0: gp_regs+f
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - r0.load

  - name: "hlt"
    steps:
      - - Clock.halt

  - name: "add"
    args:
      - r0: gp_regs
      - r1: gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - r1.alu_r
        - AddSub.out
        - F.calc

  - name: "adc"
    args:
      - r0: gp_regs
      - r1: gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - r1.alu_r
        - AddSub.out
        - F.calc
    conditions:
      - match:
          C: true
        steps:
          - - r0.load
            - r0.alu_l
            - r1.alu_r
            - AddSub.out
            - AddSub.carry_in
            - F.calc

  - name: "sub"
    args:
      - r0: gp_regs
      - r1: ^gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - r1.alu_r
        - AddSub.out
        - AddSub.alt
        - F.calc

  - name: "sbb"
    args:
      - r0: gp_regs
      - r1: ^gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - r1.alu_r
        - AddSub.out
        - AddSub.alt
        - F.calc
    conditions:
      - match:
          C: true
        steps:
          - - r0.load
            - r0.alu_l
            - r1.alu_r
            - AddSub.out
            - AddSub.alt
            - AddSub.carry_in
            - F.calc

  - name: "and"
    args:
      - r0: gp_regs
      - r1: ^gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - r1.alu_r
        - AndOr.out
        - F.calc

  - name: "or"
    args:
      - r0: gp_regs
      - r1: ^gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - r1.alu_r
        - AndOr.out
        - AndOr.alt
        - F.calc

  - name: "xor"
    args:
      - r0: gp_regs
      - r1: ^gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - r1.alu_r
        - XorNot.out
        - F.calc

  - name: "not"
    args:
      - r0: gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - XorNot.out
        - XorNot.alt
        - F.calc

  - name: "clr"
    args:
      - r0: gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - r0.alu_r
        - XorNot.out
        - F.calc

  - name: "inc"
    args:
      - r0: gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - AddSub.out
        - AddSub.carry_in
        - F.calc

  - name: "dec"
    args:
      - r0: gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - AddSub.out
        - AddSub.alt
        - AddSub.carry_in
        - F.calc

  - name: "shr"
    args:
      - r0: gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - ShiftSwap.out
        - F.calc

  - name: "ror"
    args:
      - r0: gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - ShiftSwap.out
        - F.calc
    conditions:
      - match:
          C: true
        steps:
          - - r0.load
            - r0.alu_l
            - ShiftSwap.out
            - ShiftSwap.carry_in
            - F.calc

  - name: "asr"
    args:
      - r0: gp_regs
    steps:
      - - r0.out
        - F.calc
      - - r0.load
        - r0.alu_l
        - ShiftSwap.out
        - F.calc
    conditions:
      - match:
          N: true
        steps:
          - - r0.out
            - F.calc
          - - r0.load
            - r0.alu_l
            - ShiftSwap.out
            - ShiftSwap.carry_in
            - F.calc

  - name: "swap"
    args:
      - r0: gp_regs
    steps:
      - - r0.load
        - r0.alu_l
        - ShiftSwap.out
        - ShiftSwap.alt
        - F.calc

  - name: "cmp"
    args:
      - r0: gp_regs
      - r1: ^gp_regs
    steps:
      - - r0.alu_l
        - r1.alu_r
        - AddSub.out
        - AddSub.alt
        - F.calc

  - name: "mov"
    args:
      - r0: gp_regs
      - r1: ^gp_regs
    steps:
      - - r0.load
        - r1.out

  - name: "out"
    args:
      - BYTE
      - r0: gp_regs
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - IOCtl.laddr
      - - r0.out
        - IOCtl.to_dev

  - name: "in"
    args:
      - r0: gp_regs
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - IOCtl.laddr
      - - r0.load
        - IOCtl.from_dev
        - F.calc

  - name: "st"
    args:
      - ADDR
      - r0: gp_regs
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TL.load
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TH.load
      - - TX.out
        - r0.out
        - Ram.write

  - name: "st"
    args:
      - TDP
      - r0: gp_regs
      - r1: gp_regs
    format: "({}+{}), {}"
    steps:
      - - r0.out
        - TDP.out
        - ACalc.load
      - - ACalc.out
        - r1.out
        - Ram.write

  - name: "ld"
    args:
      - r0: gp_regs
      - ADDR
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TL.load
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TH.load
      - - TX.out
        - r0.load
        - Ram.out
        - F.calc

  - name: "ld"
    args:
      - r0: gp_regs
      - SDP
      - r1: gp_regs
    format: "{}, ({}+{})"
    steps:
      - - r1.out
        - SDP.out
        - ACalc.load
      - - ACalc.out
        - r0.load
        - Ram.out
        - F.calc

  - name: "st"
    args:
      - TDP
      - r0: gp_regs
    format: "({}++), {}"
    steps:
      - - r0.out
        - TDP.out
        - TDP.inc
        - Ram.write

  - name: "jmp"
    args:
      - ADDR
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TL.load
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TH.load
      - - TX.out
        - PC.load

  - name: "beq"
    args:
      - ADDR
    steps:
      - - PC.out
        - PC.inc
      - - PC.out
        - PC.inc
    conditions:
      - match:
          Z: true
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TL.load
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TH.load
          - - TX.out
            - PC.load

  - name: "bne"
    args:
      - ADDR
    steps:
      - - PC.out
        - PC.inc
      - - PC.out
        - PC.inc
    conditions:
      - match:
          Z: false
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TL.load
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TH.load
          - - TX.out
            - PC.load

  - name: "bcs"
    args:
      - ADDR
    steps:
      - - PC.out
        - PC.inc
      - - PC.out
        - PC.inc
    conditions:
      - match:
          C: true
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TL.load
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TH.load
          - - TX.out
            - PC.load

  - name: "bcc"
    args:
      - ADDR
    steps:
      - - PC.out
        - PC.inc
      - - PC.out
        - PC.inc
    conditions:
      - match:
          C: false
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TL.load
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TH.load
          - - TX.out
            - PC.load

  - name: "bmi"
    args:
      - ADDR
    steps:
      - - PC.out
        - PC.inc
      - - PC.out
        - PC.inc
    conditions:
      - match:
          N: true
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TL.load
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TH.load
          - - TX.out
            - PC.load

  - name: "bpl"
    args:
      - ADDR
    steps:
      - - PC.out
        - PC.inc
      - - PC.out
        - PC.inc
    conditions:
      - match:
          N: false
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TL.load
          - - PC.out
            - PC.inc
            - ProgMem.out
            - TH.load
          - - TX.out
            - PC.load

  - name: "push"
    args:
      - r0: gp_regs+f
    steps:
      - - SP.out
        - SP.dec
      - - SP.out
        - r0.out
        - Ram.write

  - name: "push"
    args:
      - LR
    steps:
      - - LR.out
        - TX.load
      - - SP.out
        - SP.dec
      - - SP.out
        - SP.dec
        - TH.out
        - Ram.write
      - - SP.out
        - TL.out
        - Ram.write

  - name: "pop"
    args:
      - r0: gp_regs+f
    steps:
      - - SP.out
        - SP.inc
        - r0.load
        - Ram.out

  - name: "pop"
    args:
      - LR
    steps:
      - - SP.out
        - SP.inc
        - TL.load
        - Ram.out
      - - SP.out
        - SP.inc
        - TH.load
        - Ram.out
      - - TX.out
        - LR.load

  - name: "call"
    args:
      - ADDR
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TL.load
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TH.load
      - - PC.out
        - LR.load
      - - TX.out
        - PC.load

  - name: "ret"
    steps:
      - - LR.out
        - PC.load

  - name: "brk"
    steps:
      - - Clock.brk

  - name: "lea"
    args:
      - SP
      - ADDR
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TL.load
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TH.load
      - - TX.out
        - SP.load

  - name: "ld"
    args:
      - r0: gp_regs
      - SP
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TL.load
      - - SP.out
        - TL.out
        - ACalc.load
        - ACalc.signed
      - - ACalc.out
        - r0.load
        - Ram.out
        - F.calc

  - name: "st"
    args:
      - SP
      - BYTE
      - r0: gp_regs
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TL.load
      - - SP.out
        - TL.out
        - ACalc.load
        - ACalc.signed
      - - ACalc.out
        - r0.out
        - Ram.write

  - name: "jmp"
    args:
      - PCREL
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - ACalc.load
        - ACalc.signed
      - - ACalc.out
        - PC.load

  - name: "beq"
    args:
      - PCREL
    steps:
      - - PC.out
        - PC.inc
    conditions:
      - match:
          Z: true
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - ACalc.load
            - ACalc.signed
          - - ACalc.out
            - PC.load

  - name: "bne"
    args:
      - PCREL
    steps:
      - - PC.out
        - PC.inc
    conditions:
      - match:
          Z: false
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - ACalc.load
            - ACalc.signed
          - - ACalc.out
            - PC.load

  - name: "bcs"
    args:
      - PCREL
    steps:
      - - PC.out
        - PC.inc
    conditions:
      - match:
          C: true
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - ACalc.load
            - ACalc.signed
          - - ACalc.out
            - PC.load

  - name: "bcc"
    args:
      - PCREL
    steps:
      - - PC.out
        - PC.inc
    conditions:
      - match:
          C: false
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - ACalc.load
            - ACalc.signed
          - - ACalc.out
            - PC.load

  - name: "bmi"
    args:
      - PCREL
    steps:
      - - PC.out
        - PC.inc
    conditions:
      - match:
          N: true
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - ACalc.load
            - ACalc.signed
          - - ACalc.out
            - PC.load

  - name: "bpl"
    args:
      - PCREL
    steps:
      - - PC.out
        - PC.inc
    conditions:
      - match:
          N: false
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - ACalc.load
            - ACalc.signed
          - - ACalc.out
            - PC.load

  - name: "call"
    args:
      - PCREL
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - ACalc.load
        - ACalc.signed
      - - PC.out
        - LR.load
      - - ACalc.out
        - PC.load

  - name: "lcmp"
    args:
      - r0: gp_regs
      - r1: ^gp_regs
    steps:
      # .add_step(l.alu_l, r.alu_r, AndOr.out, F.calc)
      - - r0.alu_l
        - r1.alu_r
        - AndOr.out
        - F.calc

  - name: "ld"
    args:
      - r0: gp_regs
      - SDP
    format: "{}, ({}++)"
    steps:
      - - r0.load
        - SDP.out
        - SDP.inc
        - Ram.out
        - F.calc

  - name: "lea"
    args:
      - SDP
      - ADDR
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TL.load
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TH.load
      - - TX.out
        - SDP.load

  - name: "lea"
    args:
      - TDP
      - ADDR
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TL.load
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TH.load
      - - TX.out
        - TDP.load

  - name: "addi"
    args:
      - r0: gp_regs
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - T.load
      - - r0.load
        - r0.alu_l
        - T.alu_r
        - AddSub.out
        - F.calc

  - name: "dummyext"
    args:
      - BYTE
    # dummy instruction - same as ldi A, imm
    # ext bit should stick, even if it is not
    # present in each step. Only steps_reset can clear it
    steps:
      - []
      - []
      - - PC.out
        - PC.inc
        - ProgMem.out
        - A.load

  - name: "adci"
    args:
      - r0: gp_regs
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - T.load
      - - r0.load
        - r0.alu_l
        - T.alu_r
        - AddSub.out
        - F.calc
    conditions:
      - match:
          C: true
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - T.load
          - - r0.load
            - r0.alu_l
            - T.alu_r
            - AddSub.out
            - AddSub.carry_in
            - F.calc

  - name: "subi"
    args:
      - r0: gp_regs
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - T.load
      - - r0.load
        - r0.alu_l
        - T.alu_r
        - AddSub.out
        - AddSub.alt
        - F.calc

  - name: "cmpi"
    args:
      - r0: gp_regs
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - T.load
      - - r0.alu_l
        - T.alu_r
        - AddSub.out
        - AddSub.alt
        - F.calc

  - name: "sbbi"
    args:
      - r0: gp_regs
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - T.load
      - - r0.load
        - r0.alu_l
        - T.alu_r
        - AddSub.out
        - AddSub.alt
        - F.calc
    conditions:
      - match:
          C: true
        steps:
          - - PC.out
            - PC.inc
            - ProgMem.out
            - T.load
          - - r0.load
            - r0.alu_l
            - T.alu_r
            - AddSub.out
            - AddSub.alt
            - AddSub.carry_in
            - F.calc

  - name: "andi"
    args:
      - r0: gp_regs
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - T.load
      - - r0.load
        - r0.alu_l
        - T.alu_r
        - AndOr.out
        - F.calc

  - name: "ori"
    args:
      - r0: gp_regs
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - T.load
      - - r0.load
        - r0.alu_l
        - T.alu_r
        - AndOr.out
        - AndOr.alt
        - F.calc

  - name: "xori"
    args:
      - r0: gp_regs
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - T.load
      - - r0.load
        - r0.alu_l
        - T.alu_r
        - XorNot.out
        - F.calc

  - name: "st"
    args:
      - SDP
      - r0: gp_regs
      - r1: gp_regs
    format: "({}+{}), {}"
    steps:
      - - r0.out
        - SDP.out
        - ACalc.load
      - - ACalc.out
        - r1.out
        - Ram.write

  - name: "ld"
    args:
      - r0: gp_regs
      - TDP
      - r1: gp_regs
    format: "{}, ({}+{})"
    steps:
      - - r1.out
        - TDP.out
        - ACalc.load
      - - ACalc.out
        - r0.load
        - Ram.out
        - F.calc

  - name: "push"
    args:
      - SDP
    steps:
      - - SDP.out
        - TX.load
      - - SP.out
        - SP.dec
      - - SP.out
        - SP.dec
        - TH.out
        - Ram.write
      - - SP.out
        - TL.out
        - Ram.write

  - name: "pop"
    args:
      - SDP
    steps:
      - - SP.out
        - SP.inc
        - TL.load
        - Ram.out
      - - SP.out
        - SP.inc
        - TH.load
        - Ram.out
      - - TX.out
        - SDP.load

  - name: "push"
    args:
      - TDP
    steps:
      - - TDP.out
        - TX.load
      - - SP.out
        - SP.dec
      - - SP.out
        - SP.dec
        - TH.out
        - Ram.write
      - - SP.out
        - TL.out
        - Ram.write

  - name: "pop"
    args:
      - TDP
    steps:
      - - SP.out
        - SP.inc
        - TL.load
        - Ram.out
      - - SP.out
        - SP.inc
        - TH.load
        - Ram.out
      - - TX.out
        - TDP.load

  - name: "tst"
    args:
      - r0: gp_regs
    steps:
      - - r0.out
        - F.calc

  - name: "st"
    args:
      - SDP
      - r0: gp_regs
    format: "({}++), {}"
    steps:
      - - r0.out
        - SDP.out
        - SDP.inc
        - Ram.write

  - name: "ld"
    args:
      - r0: gp_regs
      - a0: stdp_regs
      - BYTE
    steps:
      - - PC.out
        - PC.inc
        - ProgMem.out
        - TL.load
      - - a0.out
        - TL.out
        - ACalc.load
        - ACalc.signed
      - - ACalc.out
        - r0.load
        - Ram.out
        - F.calc

  - name: "st"
    args:
      - a0: stdp_regs
      - BYTE
